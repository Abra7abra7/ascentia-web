<svg viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aBig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8B86D"/>
      <stop offset="35%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#B87333"/>
    </linearGradient>
    <linearGradient id="scentiaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E8F0"/>
      <stop offset="100%" stop-color="#A0A0B8"/>
    </linearGradient>
  </defs>

  <!-- Veľké A — bronzové, výrazné -->
  <text x="65" y="90" font-family="'Times New Roman', Georgia, serif" 
        font-size="96" font-weight="700" letter-spacing="0" 
        fill="url(#aBig)" text-anchor="middle"
        >A</text>

  <!-- SCENTIA — normálna veľkosť, svetlý text -->
  <text x="140" y="67" font-family="'Times New Roman', Georgia, serif" 
        font-size="34" font-weight="400" letter-spacing="10" 
        fill="url(#scentiaGrad)"
        >SCENTIA</text>

  <!-- Tagline: AUTONOMOUS COMPANY -->
  <text x="140" y="86" font-family="'Helvetica Neue', Arial, sans-serif" 
        font-size="9" font-weight="300" letter-spacing="5" 
        fill="#CD7F32" opacity="0.7"
        >AUTONOMOUS COMPANY</text>

  <!-- Bronze divider -->
  <line x1="140" y1="94" x2="340" y2="94" stroke="#CD7F32" stroke-width="0.5" opacity="0.3"/>
</svg>