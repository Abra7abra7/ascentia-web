<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgSquare" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#003166"/>
      <stop offset="60%" stop-color="#002147"/>
      <stop offset="100%" stop-color="#001530"/>
    </radialGradient>
    <linearGradient id="aBigSq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8B86D"/>
      <stop offset="35%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#B87333"/>
    </linearGradient>
    <linearGradient id="scentiaGradSq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E8F0"/>
      <stop offset="100%" stop-color="#A0A0B8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="20" y="20" width="360" height="360" rx="60" fill="url(#bgSquare)"/>
  <rect x="20" y="20" width="360" height="360" rx="60" fill="none" stroke="#CD7F32" stroke-width="0.8" opacity="0.2"/>

  <!-- Veľké A — bronzové, výrazné -->
  <text x="200" y="210" font-family="'Times New Roman', Georgia, serif" 
        font-size="160" font-weight="700" letter-spacing="0" 
        fill="url(#aBigSq)" text-anchor="middle"
        >A</text>

  <!-- SCENTIA pod A -->
  <text x="200" y="270" font-family="'Times New Roman', Georgia, serif" 
        font-size="40" font-weight="400" letter-spacing="14" 
        fill="url(#scentiaGradSq)" text-anchor="middle"
        >SCENTIA</text>

  <!-- Bronze divider -->
  <line x1="120" y1="290" x2="280" y2="290" stroke="#CD7F32" stroke-width="0.8" opacity="0.4"/>

  <!-- Tagline -->
  <text x="200" y="320" font-family="'Helvetica Neue', Arial, sans-serif" 
        font-size="12" font-weight="300" letter-spacing="5" 
        fill="#CD7F32" opacity="0.6" text-anchor="middle"
        >AUTONOMOUS COMPANY</text>
</svg>