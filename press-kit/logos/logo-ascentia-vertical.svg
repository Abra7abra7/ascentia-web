<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aBigV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8B86D"/>
      <stop offset="35%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#B87333"/>
    </linearGradient>
    <linearGradient id="scentiaGradV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E8F0"/>
      <stop offset="100%" stop-color="#A0A0B8"/>
    </linearGradient>
  </defs>

  <!-- Veľké A — bronzové, výrazné -->
  <text x="100" y="100" font-family="'Times New Roman', Georgia, serif" 
        font-size="100" font-weight="700" letter-spacing="0" 
        fill="url(#aBigV)" text-anchor="middle"
        >A</text>

  <!-- SCENTIA pod A -->
  <text x="100" y="130" font-family="'Times New Roman', Georgia, serif" 
        font-size="22" font-weight="400" letter-spacing="12" 
        fill="url(#scentiaGradV)" text-anchor="middle"
        >SCENTIA</text>

  <!-- Bronze divider -->
  <line x1="70" y1="140" x2="130" y2="140" stroke="#CD7F32" stroke-width="0.6" opacity="0.4"/>

  <!-- Tagline -->
  <text x="100" y="158" font-family="'Helvetica Neue', Arial, sans-serif" 
        font-size="7" font-weight="300" letter-spacing="4" 
        fill="#CD7F32" opacity="0.6" text-anchor="middle"
        >AUTONOMOUS COMPANY</text>
</svg>