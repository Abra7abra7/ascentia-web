<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#003166"/>
      <stop offset="60%" stop-color="#002147"/>
      <stop offset="100%" stop-color="#001530"/>
    </radialGradient>
    <linearGradient id="gradHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002147" stop-opacity="1"/>
      <stop offset="100%" stop-color="#CD7F32" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="gradBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B86D"/>
      <stop offset="50%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#B87333"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="20" y="20" width="360" height="360" rx="60" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="360" height="360" rx="60" fill="none" stroke="#CD7F32" stroke-width="0.8" opacity="0.2"/>

  <!-- Hexagon icon -->
  <g transform="translate(75, 40) scale(2.0)">
    <!-- Hexagon outline -->
    <polygon points="60,10 108,37.5 108,92.5 60,120 12,92.5 12,37.5"
             fill="none" stroke="url(#gradHex)" stroke-width="3"/>
    <!-- Inner A letterform -->
    <polygon points="60,35 82,88 73,88 68,75 52,75 47,88 38,88 60,35"
             fill="#CD7F32"/>
  </g>

  <!-- ASCENTIA text below -->
  <text x="200" y="335" font-family="'Times New Roman', Georgia, serif"
        font-size="38" font-weight="400" letter-spacing="10"
        fill="url(#gradBronze)" text-anchor="middle">ASCENTIA</text>

  <!-- Bronze divider -->
  <line x1="120" y1="355" x2="280" y2="355" stroke="#CD7F32" stroke-width="0.8" opacity="0.4"/>

  <!-- Tagline -->
  <text x="200" y="375" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" font-weight="300" letter-spacing="5"
        fill="#CD7F32" opacity="0.6" text-anchor="middle">TECHNICAL AI ENGINEERING</text>
</svg>