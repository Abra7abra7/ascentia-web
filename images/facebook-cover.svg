<svg viewBox="0 0 1640 856" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001530"/>
      <stop offset="40%" stop-color="#002147"/>
      <stop offset="70%" stop-color="#003166"/>
      <stop offset="100%" stop-color="#001530"/>
    </linearGradient>
    <linearGradient id="gradHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002147" stop-opacity="1"/>
      <stop offset="100%" stop-color="#CD7F32" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="gradBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B86D"/>
      <stop offset="35%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#B87333"/>
    </linearGradient>
  </defs>
  <rect width="1640" height="856" fill="url(#bgBanner)"/>
  <line x1="0" y1="855" x2="1640" y2="855" stroke="#CD7F32" stroke-width="0.5" opacity="0.2"/>

  <!-- Hexagon icon (left side, centered vertically) -->
  <g transform="translate(190, 190) scale(3.8)">
    <polygon points="60,10 108,37.5 108,92.5 60,120 12,92.5 12,37.5"
             fill="none" stroke="url(#gradHex)" stroke-width="3"/>
    <polygon points="60,35 82,88 73,88 68,75 52,75 47,88 38,88 60,35"
             fill="#CD7F32"/>
  </g>

  <!-- ASCENTIA text -->
  <text x="720" y="400" font-family="'Times New Roman', Georgia, serif"
        font-size="130" font-weight="700" letter-spacing="22"
        fill="url(#gradBronze)">ASCENTIA</text>

  <!-- Tagline -->
  <text x="720" y="480" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="34" font-weight="300" letter-spacing="10"
        fill="#CD7F32" opacity="0.6">TECHNICAL AI ENGINEERING</text>

  <!-- Bronze divider -->
  <line x1="720" y1="520" x2="1200" y2="520" stroke="#CD7F32" stroke-width="1" opacity="0.3"/>
</svg>