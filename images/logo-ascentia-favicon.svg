<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002147" stop-opacity="1"/>
      <stop offset="100%" stop-color="#CD7F32" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Dark navy rounded square background -->
  <rect x="5" y="5" width="90" height="90" rx="18" fill="#002147"/>

  <!-- Simplified hexagon A -->
  <polygon points="50,12 87,37 87,63 50,88 13,63 13,37"
           fill="none" stroke="url(#gradHex)" stroke-width="2.5"/>
  <!-- Inner A -->
  <polygon points="50,30 65,68 60,68 57,60 43,60 40,68 35,68 50,30"
           fill="#CD7F32"/>
</svg>